name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The Electron zip comes from GitHub releases, which fail intermittently.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/browser/package.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
      - run: pnpm typecheck
      - run: pnpm test
      - name: End-to-end tests
        run: pnpm --filter @potato/browser test:e2e

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: apps/browser/test-results
          retention-days: 7

  ios:
    # On the public mirror only, where macOS minutes are free; it gets every commit of main.
    if: github.repository == 'potatobrowser/potato-browser'
    # GitHub's Xcode 27 image (preview): the app needs the iOS 27 SDK.
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      # The pinned filter lists the app bundles (apps/browser/filters/lock.json).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/browser/.cache/filters
          key: filters-${{ hashFiles('apps/browser/filters/lock.json') }}
      - run: pnpm install --frozen-lockfile
      - name: XCTest unit tests (simulator)
        run: apps/ios/scripts/unit-tests.sh
