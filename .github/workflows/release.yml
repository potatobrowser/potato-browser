# Builds the DMGs for a version tag, attests where they came from and publishes the GitHub
# Release that potatobrowser.com and the in-app update check read. Tags are pushed as v<version>
# of apps/browser/package.json.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build again, like v0.3.1
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      # No dependency cache on purpose: release builds install from the lockfile alone.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./apps/browser/package.json').version")
          test "$TAG" = "v$version" || { echo "::error::tag $TAG does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build both DMGs
        run: node apps/browser/scripts/dist.mjs

      - name: Write latest.json, SHA256SUMS and notes
        run: node apps/browser/scripts/release-manifest.mjs --commit "$(git rev-parse HEAD)"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apps/browser/release/Potato-Browser-*.dmg
            apps/browser/release/latest.json

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: apps/browser/release
        run: |
          assets=("Potato-Browser-$VERSION-arm64.dmg" "Potato-Browser-$VERSION-x64.dmg" latest.json SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "Potato Browser $VERSION" --notes-file notes.md
          fi
