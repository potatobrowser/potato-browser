<!doctype html>
<html>
<head><meta charset="utf-8"><title>Potato Bank sign in</title>
<style>body{font:15px system-ui;margin:40px} input{display:block;margin:8px 0 16px;padding:6px;width:260px}</style></head>
<body>
<h1>Sign in</h1>
<form id="login" action="/welcome" method="post">
  <label>Email <input id="username" name="email" type="email" autocomplete="username"></label>
  <label>Password <input id="password" name="password" type="password" autocomplete="current-password"></label>
  <button id="submit" type="submit">Sign in</button>
</form>
<p id="state"></p>
<script>
  // Like a framework: the page only learns values through input events.
  const state = {};
  for (const el of document.querySelectorAll('input')) el.addEventListener('input', () => {
    state[el.id] = el.value;
    document.getElementById('state').textContent = JSON.stringify(state);
  });
</script>
</body>
</html>
