<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Humming Potato</title></head>
<body>
<h1>Humming Potato</h1>
<button id="play">Play</button>
<button id="stop">Stop</button>
<p id="state">silent</p>
<script>
  let ctx = null;
  document.getElementById('play').onclick = async () => {
    ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    gain.gain.value = 0.05;
    osc.frequency.value = 330;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    await ctx.resume();
    document.getElementById('state').textContent = ctx.state;
  };
  document.getElementById('stop').onclick = async () => {
    await ctx?.close();
    ctx = null;
    document.getElementById('state').textContent = 'silent';
  };
</script>
</body>
</html>
